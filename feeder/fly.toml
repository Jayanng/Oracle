# fly.toml for the Feeder (sports data ingestion + API)
app = "kickoff-feeder"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  FEEDER_MODE = "hybrid"

[[services]]
  internal_port = 4030
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    path = "/health"
    method = "GET"
    protocol = "http"
