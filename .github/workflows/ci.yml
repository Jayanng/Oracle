name: CI

on:
  push:
    branches: [Master, main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.9.5 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-git
      - name: Test
        working-directory: contracts
        run: forge test -vv

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm --workspace feeder run build
      - run: npm --workspace agent run build
      - run: npm --workspace x402-endpoint run build
      - run: npm --workspace frontend run build
        env:
          NEXT_PUBLIC_INJ_EVM_CHAIN_ID: "1439"
          NEXT_PUBLIC_INJ_EVM_RPC: https://k8s.testnet.json-rpc.injective.network
          NEXT_PUBLIC_INJ_EVM_EXPLORER: https://testnet.blockscout.injective.network
          NEXT_PUBLIC_ORACLE_ADDRESS: ${{ secrets.NEXT_PUBLIC_ORACLE_ADDRESS }}
          NEXT_PUBLIC_DROPS_ADDRESS: ${{ secrets.NEXT_PUBLIC_DROPS_ADDRESS }}
          NEXT_PUBLIC_TREASURY_ADDRESS: ${{ secrets.NEXT_PUBLIC_TREASURY_ADDRESS }}
          NEXT_PUBLIC_USDC_ADDRESS: "0x0C382e685bbeeFE5d3d9C29e29E341fEE8E84C5d"
          NEXT_PUBLIC_CCTP_TOKEN_MESSENGER: "0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA"
