[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
injective_testnet = "${INJ_EVM_RPC}"

[etherscan]
injective_testnet = { key = "verifycontract", url = "https://testnet.blockscout-api.injective.network/api" }
